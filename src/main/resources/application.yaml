spring:
  application:
    name: confirmacao-consultas

  profiles:
    active: local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

app:
  password-reset:
    expiration: PT30M
    expose-token: false
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:http://localhost:8080}
      expiration: PT8H
